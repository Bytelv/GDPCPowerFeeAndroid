name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 仓库里不放 gradle wrapper 的二进制，由 action 直接装指定版本的 Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode keystore (optional)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # 允许把 "KEYSTORE_BASE64=..." 整行粘进来，也容忍多余空白/换行
          VALUE="$KEYSTORE_BASE64"
          case "$VALUE" in
            KEYSTORE_BASE64=*) VALUE="${VALUE#KEYSTORE_BASE64=}" ;;
          esac
          VALUE="$(printf '%s' "$VALUE" | tr -d '[:space:]')"
          if [ -n "$VALUE" ]; then
            printf '%s' "$VALUE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "have_keystore=yes" >> "$GITHUB_OUTPUT"
            echo "签名密钥已就绪，将构建 release 包"
          else
            echo "have_keystore=no" >> "$GITHUB_OUTPUT"
            echo "::warning::未读到 KEYSTORE_BASE64（密钥应填在 Repository secrets，不是 Environment secrets）。本次构建 debug 包，签名与 release 不同，不要用它给同学长期分发。"
          fi

      - name: Build signed release APK
        if: steps.keystore.outputs.have_keystore == 'yes'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Build debug APK
        if: steps.keystore.outputs.have_keystore != 'yes'
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          # 产物名直接标明签名状态，避免误把 debug 包当正式包分发
          name: powerfee-sentry-apk${{ steps.keystore.outputs.have_keystore == 'yes' && '-signed' || '-debug-unsigned-for-release' }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
