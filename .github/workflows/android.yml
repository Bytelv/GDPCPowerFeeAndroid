name: Build APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

# 发 Release 需要写权限；fork 来的 PR 由 GitHub 强制降为只读，不受影响
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 仓库里不放 gradle wrapper 的二进制，由 action 直接装指定版本的 Gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode keystore (optional)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # 允许把 "KEYSTORE_BASE64=..." 整行粘进来，也容忍多余空白/换行
          VALUE="$KEYSTORE_BASE64"
          case "$VALUE" in
            KEYSTORE_BASE64=*) VALUE="${VALUE#KEYSTORE_BASE64=}" ;;
          esac
          VALUE="$(printf '%s' "$VALUE" | tr -d '[:space:]')"
          if [ -n "$VALUE" ]; then
            printf '%s' "$VALUE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "have_keystore=yes" >> "$GITHUB_OUTPUT"
            echo "签名密钥已就绪，将构建 release 包"
          else
            echo "have_keystore=no" >> "$GITHUB_OUTPUT"
            echo "::warning::未读到 KEYSTORE_BASE64（密钥应填在 Repository secrets，不是 Environment secrets）。本次构建 debug 包，签名与 release 不同，不要用它给同学长期分发。"
          fi

      - name: Build signed release APK
        if: steps.keystore.outputs.have_keystore == 'yes'
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Build debug APK
        if: steps.keystore.outputs.have_keystore != 'yes'
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          # 产物名直接标明签名状态，避免误把 debug 包当正式包分发
          name: powerfee-sentry-apk${{ steps.keystore.outputs.have_keystore == 'yes' && '-signed' || '-debug-unsigned-for-release' }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 打 tag（v1.0 这种）时自动发 Release，把签名 APK 作为附件公开直链。
      # 之所以不手工上传：Actions 产物下载需要登录 GitHub，同学没账号下不动；
      # Release 附件是公开直链，而且以后每次发版只要打个 tag。
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v') && steps.keystore.outputs.have_keystore == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            app/build/outputs/apk/release/app-release.apk \
            --title "电量哨兵 $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md

      - name: Warn when a tag was pushed without signing keys
        if: startsWith(github.ref, 'refs/tags/v') && steps.keystore.outputs.have_keystore != 'yes'
        run: |
          echo "::error::推了 tag 但没有签名密钥，拒绝发布 debug 包。请检查 Repository secrets 后重新打 tag。"
          exit 1
